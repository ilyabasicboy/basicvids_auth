services:
  basicvids_auth:
    image: ilyabasicboy/basicvids-auth:latest
    build: .

    container_name: basicvids_auth
    extra_hosts:
      - "${CUSTOM_HOST:-host.docker.internal}:host-gateway"
    volumes:
      - ${DATA_PATH:-./data}:/basicvids_auth/data
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    entrypoint: ["/basicvids_auth/entrypoint.sh"]
    expose:
      - "8000"
    networks:
      - basicvids

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  basicvids:
    external: true
    name: basicvids
